name: skillbetting

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-backend-image: &backend-image
  image: skillbetting-backend:${RELEASE_ID:?Run deploy/manage.sh init first}
  build:
    context: ..
    dockerfile: Dockerfile
    target: runtime

x-database-admin: &database-admin
  PGHOST: postgres
  PGDATABASE: skillbetting
  PGUSER: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD:?Generate persistent deployment secrets first}

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillbetting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate persistent deployment secrets first}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Generate persistent deployment secrets first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    tmpfs:
      - /var/run/postgresql:rw,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d skillbetting']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    mem_limit: 1g
    networks: [database]
    logging: *logging

  migrate:
    <<: *backend-image
    restart: 'no'
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/skillbetting
    command: [node, scripts/migrate-production.mjs]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    networks: [database]
    logging: *logging

  backend:
    <<: *backend-image
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact public HTTPS origin}
      TRUST_PROXY_HOPS: '1'
      DATABASE_URL: postgresql://skillbetting_app:${APP_DATABASE_PASSWORD}@postgres:5432/skillbetting
      TABLE_CODE_SECRET: ${TABLE_CODE_SECRET:?Keep the private-table key stable}
      OTP_SECRET: ${OTP_SECRET:?Keep the verification key stable}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      SEVEN_API_KEY: ${SEVEN_API_KEY:-}
      SEVEN_SENDER: ${SEVEN_SENDER:-SkillBet}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    networks: [application, database]
    logging: *logging

  frontend:
    image: skillbetting-frontend:${RELEASE_ID:?Run deploy/manage.sh init first}
    build:
      context: ../../skillbetting-frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:3000
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    networks: [application]
    logging: *logging

  edge:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      SITE_HOST: ${SITE_HOST:?Set the DNS hostname}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    networks: [application]
    logging: *logging

  backup:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *database-admin
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint: [/bin/sh, /ops/backup.sh]
    command: [loop]
    volumes:
      - ./backup.sh:/ops/backup.sh:ro
      - backups:/backups
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD-SHELL,
          'test -n "$$(find /backups -maxdepth 1 -name ''skillbetting-*.dump'' -mmin -1500 -print -quit)"',
        ]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 2m
    mem_limit: 128m
    networks: [database]
    logging: *logging

  restore-check:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    profiles: [ops]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *database-admin
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD}
    entrypoint: [/bin/sh, /ops/restore.sh]
    command: [check]
    volumes:
      - ./restore.sh:/ops/restore.sh:ro
      - ./postgres-init.sh:/ops/postgres-init.sh:ro
    tmpfs: ['/tmp:rw,noexec,nosuid,size=512m']
    mem_limit: 512m
    networks: [database]
    logging: *logging

volumes:
  postgres_data:
  backups:
  caddy_data:
  caddy_config:

networks:
  application:
  database:
    internal: true
